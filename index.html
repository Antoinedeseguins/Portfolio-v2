		<!-- The home page's desk toy (only on screens wide enough to show it) is a chain of modules, each found only once
		     the one before has arrived: fetch them all now, alongside the page. Ahead of the stylesheets, which would hold
		     this script back. The ?v must stay the one in JS/main.js's import, or the toy is fetched twice. The picture
		     shown in its place until it is ready comes first. -->
		<script>
			if (matchMedia("(min-width: 1181px)").matches) {
				document.head.append(Object.assign(document.createElement("link"), {
					rel: "preload", as: "image", href: "three.js/about/desk-room-poster-1x.webp",
					imageSrcset: "three.js/about/desk-room-poster-1x.webp 1x, three.js/about/desk-room-poster-2x.webp 2x",
				}));
				for (const path of ["three.js/about/desk-room.js?v=181", "three.js/vendor/three.module.js", "three.js/vendor/three.core.js", "three.js/vendor/GLTFLoader.js", "three.js/vendor/BufferGeometryUtils.js"]) {
					document.head.append(Object.assign(document.createElement("link"), { rel: "modulepreload", href: path }));
				}
			}
		</script>
