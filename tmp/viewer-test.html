<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/" />
<!-- Temporary page to screenshot the controller viewer on its own. Delete when done. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="CSS/styles.css?t=test" />
<style>.hero-arrow { opacity: 1 !important; } body { padding: 40px; } .controller-frame { width: 1100px; }</style>
</head>
<body>
    <div class="hero-frame controller-frame">
      <div class="controller-viewer">
        <img class="controller-poster" src="Assets/spaceageracer/img/viewer-poster.webp" alt="Space Age Racer dual-lever controller" />
        <canvas class="controller-canvas" tabindex="0" aria-label="3D controller: drag to rotate, arrow keys to orbit, plus and minus to zoom"></canvas>
        <div class="controller-overlay">
          <span class="controller-view-label" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9ZM4 7.5l8 4.5 8-4.5M12 12v9" /></svg></span>
          <svg class="controller-detail-connector" aria-hidden="true" style="display:none"><path/></svg>
          <div class="controller-hotspots" role="group" aria-label="Explore controller components">
            <button class="controller-hotspot" type="button" data-hotspot="left" aria-label="About the left lever" aria-pressed="false" aria-controls="controller-detail" hidden></button>
            <button class="controller-hotspot" type="button" data-hotspot="right" aria-label="About the right lever" aria-pressed="false" aria-controls="controller-detail" hidden></button>
            <button class="controller-hotspot" type="button" data-hotspot="boost" aria-label="About the boost button" aria-pressed="false" aria-controls="controller-detail" hidden></button>
            <button class="controller-hotspot" type="button" data-hotspot="body" aria-label="Remove front cover" aria-pressed="false" aria-controls="controller-detail" hidden></button>
            <button class="controller-hotspot" type="button" data-hotspot="potentiometers" aria-label="About the left potentiometer" aria-pressed="false" aria-controls="controller-detail" hidden></button>
            <button class="controller-hotspot" type="button" data-hotspot="potentiometerRight" aria-label="About the right potentiometer" aria-pressed="false" aria-controls="controller-detail" hidden></button>
          </div>
          <aside class="controller-detail" id="controller-detail" aria-label="Selected component" hidden>
            <div class="controller-detail-copy" aria-live="polite" aria-atomic="true"><h3></h3><p></p></div>
          </aside>
          <div class="controller-gesture" aria-hidden="true">
            <span class="controller-gesture-item"><svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="24" rx="7"/><path d="M5 11h14M12 2v9M12 5v3"/></svg><span><strong>Drag</strong><span>to rotate</span></span></span>
            <span class="controller-gesture-item"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m10 10 3 15 3-6 6-3-12-6Z M10 2v3M2 10h3M4 4l2 2M16 4l-2 2M4 16l2-2"/></svg><span><strong>Click a point</strong><span>to explore</span></span></span>
          </div>
          <div class="controller-view-actions">            <button type="button" data-viewer-action="reset" aria-label="Reset controller view" title="Reset view"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 8a6 6 0 1 1 .5 5M4 3v5h5"/></svg></button>          </div>
        </div>
        <p class="controller-error" hidden>The 3D viewer is not available in this browser.</p>
      </div>
      <button class="hero-arrow" type="button" data-media-direction="-1"><span aria-hidden="true">‹</span></button>
      <button class="hero-arrow" type="button" data-media-direction="1"><span aria-hidden="true">›</span></button>
    </div>
<script type="module">
const params = new URLSearchParams(location.search);
const frame = document.querySelector(".controller-frame");
const { enableController } = await import(`/three.js/space-age-racer/controller-viewer/controller-viewer.js?t=${Date.now()}`);
await enableController(frame);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
await wait(400);
const viewerEl = frame.querySelector(".controller-viewer");
const until = test => new Promise(resolve => { const step = () => test() ? resolve() : requestAnimationFrame(step); step(); });
if (params.has("open")) { frame.querySelector('[data-hotspot="body"]').click(); await until(() => viewerEl.dataset.coverOpen === "true"); }
if (params.has("lever")) {
  const canvas = frame.querySelector("canvas"); canvas.setPointerCapture = () => {}; canvas.hasPointerCapture = () => false;
  const point = frame.querySelector('[data-hotspot="left"]').getBoundingClientRect();
  const x = point.left + point.width / 2, y = point.top + point.height / 2;
  const fire = (type, dy) => canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 9, isPrimary: true, button: 0, pointerType: "mouse", clientX: x, clientY: y + dy }));
  fire("pointerdown", 0);
  let t = 0; setInterval(() => { t += 1; fire("pointermove", -Number(params.get("lever")) * Math.min(1, t / 10) - 3 * Math.sin(t / 3)); }, 30);
}
if (params.has("press")) {
  const canvas = frame.querySelector("canvas"); canvas.setPointerCapture = () => {}; canvas.hasPointerCapture = () => false;
  const point = frame.querySelector('[data-hotspot="boost"]').getBoundingClientRect();
  const fire = type => canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 11, isPrimary: true, button: 0, pointerType: "mouse", clientX: point.left + point.width / 2, clientY: point.top + point.height / 2 }));
  const press = () => { fire("pointerup"); fire("pointerdown"); };
  press(); setInterval(press, Number(params.get("press")) || 700);
}
if (params.has("presspoint")) {
  const point = frame.querySelector('[data-hotspot="boost"]');
  const fire = type => point.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 12, isPrimary: true, button: 0, pointerType: "mouse" }));
  const press = () => { fire("pointerup"); fire("pointerdown"); };
  press(); setInterval(press, 700);
}
if (params.get("select")) frame.querySelector(`[data-hotspot="${params.get("select")}"]`).click();
await wait(1500);
document.body.insertAdjacentHTML("afterbegin", `<p style="position:fixed;top:0;left:0;margin:0;font:14px monospace;background:#fff;z-index:9">`);
document.body.firstElementChild.textContent = `open=${frame.querySelector(".controller-viewer").dataset.coverOpen} pressed=${[...frame.querySelectorAll("[aria-pressed=true]")].map(b => b.dataset.hotspot)}`;
</script>
</body>
</html>
